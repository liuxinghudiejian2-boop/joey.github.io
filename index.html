<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢悦夜赏 · 高保真原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#050810; --surface:#080d1a; --surface2:#0c1220; --border:#1a2a4a;
    --text:#dde8ff; --muted:#4a6080; --accent:#00e5ff; --accent2:#4facfe;
    --teal:#00c9a7; --like:#ff6b9d;
    --serif:"Courier New","Consolas",monospace;
    --glow-accent:0 0 20px rgba(0,229,255,.3); --glow-like:0 0 20px rgba(255,107,157,.3);
  }
  body{
    font-family:"Microsoft YaHei","PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7;
    min-height:100vh; -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(rgba(0,229,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,229,255,.025) 1px,transparent 1px);
    background-size:40px 40px;
  }
  h1,h2,h3,.serif{ font-family:var(--serif); letter-spacing:.5px; }

  /* ===== 登录注册页 ===== */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px;}
  .auth-card{ width:100%; max-width:420px; background:rgba(8,13,26,.9); border:1px solid rgba(0,229,255,.2);
    border-radius:10px; padding:40px 32px; backdrop-filter:blur(12px);
    box-shadow:0 0 40px rgba(0,229,255,.08), 0 8px 32px rgba(0,0,0,.5);}
  .auth-logo{ display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:32px;}
  .auth-logo .t{ font-size:24px; font-weight:700; font-family:var(--serif); letter-spacing:3px;}
  .auth-logo .s{ font-size:11px; color:var(--muted); letter-spacing:2px;}
  .auth-tabs{ display:flex; border-bottom:1px solid rgba(0,229,255,.15); margin-bottom:26px;}
  .auth-tabs button{ flex:1; background:transparent;border:none;color:var(--muted);
    padding:12px; cursor:pointer; font-size:13px; transition:.2s; border-bottom:2px solid transparent;}
  .auth-tabs button.active{ color:var(--accent); border-color:var(--accent); text-shadow:var(--glow-accent);}
  .subtabs{ display:flex; gap:28px; margin-bottom:22px; justify-content:center;}
  .subtabs button{ background:transparent;border:none;color:var(--muted); font-size:13px;
    cursor:pointer; padding:6px 0; border-bottom:2px solid transparent; letter-spacing:.5px;}
  .subtabs button.active{ color:var(--text); border-color:var(--accent);}
  .demo-hint{ font-size:11px; color:var(--muted); background:rgba(0,229,255,.04);
    border:1px solid rgba(0,229,255,.1); border-radius:6px; padding:12px 14px; margin-bottom:18px; line-height:1.7;}
  .auth-tip{ font-size:12px; color:var(--muted); text-align:center; margin-top:20px;}
  .auth-tip a{ color:var(--accent); cursor:pointer;}

  /* ===== 通用表单 ===== */
  .field{ margin-bottom:18px;}
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:8px; letter-spacing:1.5px; text-transform:uppercase;}
  .field input[type=text], .field input[type=password]{
    width:100%; background:rgba(0,229,255,.03); border:1px solid rgba(0,229,255,.15); color:var(--text);
    border-radius:6px; padding:13px 16px; font-size:14px; transition:.2s;}
  .field input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,229,255,.08);}
  .btn{ border:none; cursor:pointer; border-radius:6px; padding:13px 26px; font-size:13px;
    font-weight:700; transition:.2s; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    letter-spacing:.8px; text-transform:uppercase;}
  .btn-primary{ background:var(--accent); color:#050810;
    box-shadow:0 0 20px rgba(0,229,255,.25);}
  .btn-primary:hover{ background:#33eaff; box-shadow:0 0 32px rgba(0,229,255,.45); transform:translateY(-1px);}
  .btn-primary:disabled{ opacity:.3; cursor:not-allowed; transform:none;}
  .btn-ghost{ background:transparent; color:var(--accent); border:1px solid rgba(0,229,255,.3);}
  .btn-ghost:hover{ border-color:var(--accent); box-shadow:0 0 16px rgba(0,229,255,.15);}
  .btn-block{ width:100%; letter-spacing:2px;}

  /* ===== 主应用 ===== */
  .app{ max-width:1100px; margin:0 auto; padding:40px 28px 100px; }
  header{ display:flex; justify-content:space-between; align-items:center;
    padding-bottom:28px; border-bottom:1px solid rgba(0,229,255,.1); margin-bottom:32px; gap:20px; flex-wrap:wrap;}
  .logo{ display:flex; align-items:center; gap:14px; font-size:20px; font-weight:700; font-family:var(--serif); letter-spacing:1px;}
  .logo small{ display:block; font-size:10px; color:var(--muted); font-weight:400; margin-top:3px; letter-spacing:1.5px; font-family:"Microsoft YaHei",sans-serif;}
  .user-box{ display:flex; align-items:center; gap:14px;}
  .user-chip{ display:flex; align-items:center; gap:10px; font-size:13px;}
  .avatar{ width:36px;height:36px;border-radius:50%; background:var(--accent);
    display:flex;align-items:center;justify-content:center; font-size:13px; font-weight:700; color:#050810; font-family:var(--serif);}
  .btn-out{ background:transparent; border:1px solid rgba(0,229,255,.2); color:var(--muted);
    padding:8px 16px; border-radius:6px; cursor:pointer; font-size:12px; transition:.2s; letter-spacing:.8px; text-transform:uppercase;}
  .btn-out:hover{ color:var(--accent); border-color:var(--accent); box-shadow:0 0 12px rgba(0,229,255,.15);}

  .role-tip{ background:rgba(0,229,255,.05); border-left:3px solid var(--accent);
    border-radius:0 6px 6px 0; padding:14px 18px; font-size:13px; color:var(--muted); margin-bottom:32px;}
  .role-tip b{ color:var(--accent); font-weight:600;}

  .tabs{ display:flex; gap:0; margin-bottom:0; flex-wrap:wrap; border-bottom:1px solid rgba(0,229,255,.1); padding-bottom:0;}
  .tab{ background:transparent; border:none; color:var(--muted);
    padding:12px 22px; cursor:pointer; font-size:13px; transition:.2s; border-bottom:2px solid transparent;
    display:inline-flex; align-items:center; gap:8px; letter-spacing:.5px;}
  .tab:hover{ color:var(--text);}
  .tab.active{ color:var(--accent); border-color:var(--accent); text-shadow:var(--glow-accent);}
  .tab .badge{ background:rgba(0,229,255,.08); color:var(--accent); font-size:11px; font-weight:700;
    border-radius:4px; padding:2px 8px; min-width:20px; text-align:center; border:1px solid rgba(0,229,255,.2);}
  .tab.active .badge{ background:var(--accent); color:#050810; border-color:var(--accent); box-shadow:0 0 12px rgba(0,229,255,.3);}

  /* ===== 内容区包裹（与导航分割） ===== */
  .content-wrap{
    background:rgba(0,229,255,.025);
    border:1px solid rgba(0,229,255,.14);
    border-radius:10px;
    padding:28px 28px 12px;
    margin-top:8px;
    position:relative;
    box-shadow:0 0 40px rgba(0,229,255,.04) inset, 0 2px 16px rgba(0,0,0,.3);
  }
  /* 顶部左角装饰文字 */
  .content-wrap::before{
    content:'CONTENT ZONE';
    position:absolute; top:-1px; left:18px;
    font-size:7px; letter-spacing:2.5px; color:rgba(0,229,255,.18);
    background:var(--bg); padding:0 8px; line-height:2;
    font-family:monospace;
  }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px;}
  .card{ background:rgba(8,13,26,.7); border:1px solid rgba(0,229,255,.1); border-radius:10px; overflow:hidden; transition:.2s;}
  .card:hover{ border-color:rgba(0,229,255,.4); box-shadow:0 0 24px rgba(0,229,255,.12);}
  .card .img{ width:100%; aspect-ratio:var(--card-ratio,9/16); position:relative; overflow:hidden; background:var(--bg);}
  .card .img img{ position:absolute; inset:0; width:100%;height:100%; object-fit:contain; padding:3px;}
  .card .meta{ padding:14px 16px; display:flex; justify-content:space-between; align-items:center;}
  .card .meta .t{ font-size:14px; font-weight:600;}
  .card .meta .s{ font-size:11px; color:var(--muted); margin-top:2px;}
  .heart{ background:rgba(0,229,255,.05); border:1px solid rgba(0,229,255,.15); width:40px;height:40px;
    border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s;}
  .heart:hover{ border-color:var(--like); box-shadow:0 0 16px rgba(255,107,157,.2);}
  .heart.on{ border-color:var(--like); background:rgba(255,107,157,.08); box-shadow:0 0 16px rgba(255,107,157,.25);}
  .heart svg{ width:20px;height:20px;}
  .del-btn{ background:rgba(0,229,255,.05); border:1px solid rgba(0,229,255,.15); width:40px;height:40px;
    border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s;}
  .del-btn:hover{ border-color:var(--like); background:rgba(255,107,157,.08);}
  .del-btn svg{ width:18px;height:18px;}
  .like-tag{ position:absolute; top:10px; left:10px; background:rgba(0,0,0,.7); color:var(--like);
    font-size:11px; padding:4px 10px; border-radius:4px; border:1px solid rgba(255,107,157,.3);}
  .src-tag{ position:absolute; top:10px; right:10px; background:rgba(0,0,0,.7); color:var(--muted);
    font-size:10px; padding:3px 9px; border-radius:4px; border:1px solid rgba(0,229,255,.15);}

  .sec-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .sec-bar h2{ font-size:18px; font-weight:700; font-family:var(--serif); letter-spacing:1px;}
  .sec-bar .cnt{ font-size:12px; color:var(--muted); letter-spacing:.5px;}

  .fav-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:28px;}
  .fav-item{ display:flex; align-items:center; gap:16px; background:rgba(8,13,26,.6);
    border:1px solid rgba(0,229,255,.1); border-radius:8px; padding:12px;}
  .fav-item .thumb{ width:80px;height:60px;border-radius:6px; flex-shrink:0; position:relative; overflow:hidden;}
  .fav-item .thumb img{ position:absolute; inset:0; width:100%;height:100%; object-fit:cover;}
  .fav-item .info{ flex:1; min-width:0;}
  .fav-item .info .t{ font-size:14px; font-weight:600;}
  .fav-item .info .s{ font-size:12px; color:var(--muted); margin-top:2px;}
  .fav-item .rm{ background:transparent;border:1px solid rgba(0,229,255,.15); color:var(--muted);
    padding:7px 14px; border-radius:6px; cursor:pointer; font-size:12px; transition:.2s;}
  .fav-item .rm:hover{ color:var(--like); border-color:var(--like); box-shadow:0 0 12px rgba(255,107,157,.15);}

  .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center;}

  .form-card{ background:rgba(8,13,26,.8); border:1px solid rgba(0,229,255,.15); border-radius:10px; padding:28px; max-width:660px;}
  .preview-box{ width:100%; aspect-ratio:9/16; border-radius:8px; position:relative; overflow:hidden;
    border:1px solid rgba(0,229,255,.1);}
  .preview-box img{ position:absolute; inset:0; width:100%;height:100%; object-fit:cover;}
  .preview-box .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:12px; padding:14px; text-align:center;}
  .preview-box-sm{ width:120px; height:160px; border-radius:6px; position:relative; overflow:hidden; flex-shrink:0;
    border:1px solid rgba(0,229,255,.1);}
  .preview-box-sm img{ position:absolute; inset:0; width:100%;height:100%; object-fit:cover;}
  .preview-box-sm .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:10px; text-align:center; padding:4px;}
  .url-row{ display:flex; gap:10px; align-items:center;}
  .url-row input{ flex:1;}
  .url-row input[type="file"]{ flex:1; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:8px 10px; font-size:12px; }
  .url-row input[type="file"]::file-selector-button{ background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--accent); padding:4px 10px; cursor:pointer; font-size:11px; }
  .url-row input[type="file"]::file-selector-button:hover{ background:var(--accent); color:#0d1117; }
  .grad-pick{ display:grid; grid-template-columns:repeat(8,1fr); gap:8px;}
  .grad-opt{ aspect-ratio:1; border-radius:4px; cursor:pointer; border:2px solid transparent; transition:.12s;}
  .grad-opt:hover{ transform:scale(1.08);}
  .grad-opt.sel{ border-color:var(--accent); box-shadow:0 0 0 2px rgba(0,229,255,.3);}
  .mini-note{ font-size:11px; color:var(--muted); margin-top:10px; line-height:1.7;}

  /* ===== 资料信息网格 ===== */
  .profile-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .profile-item{ display:flex; flex-direction:column; gap:6px; }
  .profile-item .pl{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .profile-item input{ width:100%; background:rgba(0,229,255,.03); border:1px solid rgba(0,229,255,.15); color:var(--text);
    border-radius:6px; padding:10px 12px; font-size:13px; transition:.2s; }
  .profile-item input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,229,255,.06); }
  @media(max-width:600px){ .profile-grid{ grid-template-columns:repeat(2,1fr);} }

  /* ===== 备注多选标签 ===== */
  .tag-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .tag-chip{ display:inline-flex; align-items:center; gap:5px; padding:7px 16px; border-radius:6px;
    border:1px solid rgba(0,229,255,.2); background:transparent; color:var(--muted); font-size:13px;
    cursor:pointer; transition:.2s; user-select:none; letter-spacing:.5px;}
  .tag-chip:hover{ border-color:var(--accent); color:var(--text);}
  .tag-chip.sel{ background:var(--accent); color:#050810;
    border-color:var(--accent); font-weight:700; box-shadow:0 0 16px rgba(0,229,255,.25);}

  /* ===== 百度网盘解析相关样式 ===== */
  .parse-status{ font-size:12px; padding:12px 14px; border-radius:6px; margin-bottom:16px; line-height:1.7;}
  .parse-status.info{ color:var(--accent); background:rgba(0,229,255,.05); border:1px solid rgba(0,229,255,.15);}
  .parse-status.error{ color:var(--like); background:rgba(255,107,157,.05); border:1px solid rgba(255,107,157,.15);}
  .parse-status.loading{ color:var(--accent); background:rgba(0,229,255,.05); border:1px solid rgba(0,229,255,.1);}
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid rgba(0,229,255,.15);
    border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; vertical-align:middle; margin-right:6px;}
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .parse-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin-bottom:18px;}
  .parse-card{ background:rgba(0,229,255,.02); border:1px solid rgba(0,229,255,.1); border-radius:8px; overflow:hidden;
    cursor:pointer; transition:.2s; position:relative;}
  .parse-card:hover{ border-color:rgba(0,229,255,.35); box-shadow:0 0 16px rgba(0,229,255,.08);}
  .parse-card.sel{ border-color:var(--accent); box-shadow:0 0 0 2px rgba(0,229,255,.2);}
  .parse-card .pi{ width:100%; aspect-ratio:4/3; position:relative; overflow:hidden; background:#03050d;}
  .parse-card .pi img{ position:absolute; inset:0; width:100%;height:100%; object-fit:cover;}
  .parse-card .pi .pfall{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:10px; color:var(--muted);}
  .parse-card .pn{ padding:9px 12px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .parse-card .check{ position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:6px;
    background:rgba(0,0,0,.7); border:1px solid rgba(0,229,255,.2); display:flex; align-items:center; justify-content:center; transition:.2s;}
  .parse-card.sel .check{ background:var(--accent); border-color:var(--accent); box-shadow:0 0 12px rgba(0,229,255,.3);}
  .parse-card.sel .check svg{ display:block;}
  .parse-card .check svg{ display:none; width:14px; height:14px;}

  .parser-config{ font-size:11px; color:var(--muted); background:var(--bg); border:1px solid var(--border);
    border-radius:4px; padding:10px 12px; margin-bottom:16px; line-height:1.7;}
  .parser-config code{ color:var(--accent); font-family:monospace; font-size:10px;}
  .parser-config .cfg-input{ background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:3px; padding:4px 8px; font-size:11px; width:200px; margin-left:6px;}

  .inbox-list{ display:flex; flex-direction:column; gap:10px;}
  .inbox-item{ display:flex; align-items:center; gap:14px; background:var(--surface);
    border:1px solid var(--border); border-radius:6px; padding:10px;}
  .inbox-item .thumb{ width:72px;height:54px;border-radius:4px; flex-shrink:0; position:relative; overflow:hidden;}
  .inbox-item .thumb img{ position:absolute; inset:0; width:100%;height:100%; object-fit:cover;}
  .inbox-item .info{ flex:1; min-width:0;}
  .inbox-item .from{ font-size:11px; color:var(--muted); margin-top:3px;}

  .empty{ text-align:center; color:var(--muted); padding:56px 20px; font-size:14px;}
  .empty .ic{ font-size:36px; margin-bottom:12px; opacity:.3;}

  .toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface); border:1px solid var(--accent); color:var(--text);
    padding:13px 22px; border-radius:4px; opacity:0; transition:.25s; z-index:50; font-size:14px;
    box-shadow:0 4px 20px rgba(0,0,0,.4); pointer-events:none;}
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
  .toast b{ color:var(--accent);}
  .toast.err{ border-color:var(--accent2);}
  .toast.err b{ color:var(--accent2);}

  .hidden{ display:none !important;}

  /* ===== 每日推荐 ===== */
  .daily-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:12px; margin-bottom:24px; }
  .daily-card{ background:rgba(8,13,26,.6); border:1px solid rgba(0,229,255,.08); border-radius:10px; overflow:hidden; transition:.2s; cursor:default; }
  .daily-card:hover{ border-color:rgba(0,229,255,.35); box-shadow:0 0 20px rgba(0,229,255,.1); }
  .daily-card .img{ width:100%; aspect-ratio:9/16; position:relative; overflow:hidden; background:var(--bg); }
  .daily-card .img img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .daily-card .tag-day{ position:absolute; top:8px; left:8px; background:rgba(0,0,0,.75); color:#4ade80;
    font-size:11px; padding:3px 9px; border-radius:4px; font-weight:700; border:1px solid rgba(74,222,128,.3); letter-spacing:.5px; }
  .daily-card .heart{ position:absolute; bottom:8px; right:8px; width:34px; height:34px; border-radius:6px;
    background:rgba(0,0,0,.6); border:1px solid rgba(0,229,255,.15); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; }
  .daily-card .heart:hover{ border-color:var(--like); box-shadow:0 0 14px rgba(255,107,157,.2); }
  .daily-card .heart svg{ width:18px; height:18px; }
  .daily-card .heart.on svg{ fill:var(--like); stroke:var(--like); }
  .daily-card .heart:not(.on) svg{ fill:none; stroke:rgba(255,255,255,.35); stroke-width:1.8; }
  .daily-card .del-mini{ position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:6px;
    background:rgba(0,0,0,.6); border:1px solid rgba(0,229,255,.15); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; }
  .daily-card .del-mini:hover{ background:rgba(255,107,157,.7); border-color:var(--like); }
  .daily-card .del-mini svg{ width:14px; height:14px; }
  .daily-card .card-nick{ position:absolute; bottom:8px; left:8px;
    background:rgba(0,0,0,.75); color:var(--accent);
    font-size:12px; font-weight:700; padding:4px 10px; border-radius:5px;
    max-width:calc(100% - 60px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    border:1px solid rgba(0,229,255,.2); letter-spacing:.5px; font-family:var(--serif); }
  .daily-pager{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:20px; padding:12px 0; }
  .daily-pager button{ background:rgba(0,229,255,.06); border:1px solid rgba(0,229,255,.2); color:var(--accent);
    padding:10px 22px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:700; transition:.2s;
    letter-spacing:.8px; text-transform:uppercase; }
  .daily-pager button:hover:not(:disabled){ border-color:var(--accent); box-shadow:0 0 16px rgba(0,229,255,.2); }
  .daily-pager button:disabled{ opacity:.3; cursor:not-allowed; }
  .daily-pager .pg-info{ font-size:12px; color:var(--muted); min-width:80px; text-align:center; letter-spacing:.5px; }

  /* ===== 收件箱删除按钮 ===== */
  .inbox-del{ background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; transition:.15s; flex-shrink:0; }
  .inbox-del:hover{ color:var(--accent2); border-color:var(--accent2); }

<script>
/* ============ 基础数据 ============ */
const GRADS = [
  ['#1a2332','#2a3441'], ['#232d3d','#344053'], ['#1c2823','#2d3b30'],
  ['#28231f','#3b3328'], ['#1f2328','#2d343d'], ['#2a2520','#3d3528'],
  ['#202d28','#2d3d33'], ['#252028','#352d3d']
];
const gradCss = i => { const [a,b]=GRADS[i%GRADS.length]; return `linear-gradient(135deg,${a},${b})`; };

/* 图片规格：仅 9:16 */
const ACCEPTED_RATIOS = [
  {ratio:9/16,  str:'9/16', label:'9:16'},
];
const RATIO_TOLERANCE = 0.03;
const RATIO_SPECS_TEXT = '仅支持 9:16 规格';

/* ===== ImgBB 图床配置 ===== */
/* 通过 Render 后端中转上传（绕过 workers.dev 被屏蔽的问题） */
const IMGBB_UPLOAD_URL = () => PARSER_BASE + '/api/upload-imgbb';

async function uploadToImgBB(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result.split(',')[1];
      try{
        const r = await fetch(IMGBB_UPLOAD_URL(), {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({image: base64})
        });
        const d = await r.json();
        if(d.success){
          resolve(d.url);
        } else {
          reject(d.error || '上传失败');
        }
      }catch(e){
        reject('上传异常：'+e.message);
      }
    };
    reader.onerror = () => reject('文件读取失败');
    reader.readAsDataURL(file);
  });
}

function matchRatio(w, h){
  if(!w || !h) return null;
  const r = w / h;
  for(const a of ACCEPTED_RATIOS){
    if(Math.abs(r - a.ratio) / a.ratio < RATIO_TOLERANCE) return a;
  }
  return null;
}

function checkImageDimensions(url, resolutionStr){
  return new Promise(resolve => {
    // 优先用 Baidu API 返回的 resolution 字段
    if(resolutionStr){
      const m = String(resolutionStr).match(/(\d+)\s*[x×*X]\s*(\d+)/);
      if(m){
        const w=+m[1], h=+m[2];
        const match = matchRatio(w, h);
        if(match){ resolve({valid:true, ratio:match.str, w, h}); return; }
      }
    }
    // 加载图片检查自然尺寸
    const img = new Image();
    img.onload = () => {
      const w=img.naturalWidth, h=img.naturalHeight;
      const match = matchRatio(w, h);
      resolve({valid:!!match, ratio:match?match.str:null, w, h});
    };
    img.onerror = () => resolve({valid:false, ratio:null, w:0, h:0});
    img.src = url;
  });
}

// Web Audio API 提示音（无需外部文件，兼容所有浏览器）
function playBeep(type='inbox'){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const freqs = type === 'inbox' ? [880, 1320] : [660, 880];
    freqs.forEach((f,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = f;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.25);
      osc.start(ctx.currentTime + i * 0.18);
      osc.stop(ctx.currentTime + i * 0.18 + 0.25);
    });
    setTimeout(()=>ctx.close(), 800);
  }catch(e){}
}

function renderInbox(){
  if(!inbox.length) return `<div class="sec-bar"><h2>收件箱</h2><span class="cnt">0 位用户</span></div>
    <div class="empty"><div class="ic">&#9993;</div>还没有用户上传图片</div>`;
  // 按用户名分组，同一用户合并
  const userMap={};
  inbox.forEach(it=>{
    const uname=extractUsername(it);
    if(!userMap[uname]) userMap[uname]={username:uname, items:[], latest:it};
    userMap[uname].items.push(it);
  });
  const users=Object.values(userMap);
  const items=users.map(u=>{
    const last=u.latest;
    // 取最多3张缩略图预览
    const thumbs = u.items.slice(0,3).map(it=>
      thumbHtml(it.url, it.grad)
    ).join('');
    return `<div class="inbox-item" data-chat="${escapeHtml(u.username)}" style="cursor:pointer">
      <div style="display:flex;gap:4px;flex-shrink:0">${thumbs}</div>
      <div class="info">
        <div class="t">${escapeHtml(u.username)}</div>
        <div class="from">上传了 ${u.items.length} 张图片</div>
      </div>
      <button class="inbox-del" data-inbox-del="${escapeHtml(u.username)}" title="删除该用户所有记录">删除</button>
      <div style="color:var(--muted);font-size:22px;flex-shrink:0;">&#8250;</div>
    </div>`;
  }).join('');
  return `<div class="sec-bar"><h2>收件箱</h2><span class="cnt">${users.length} 位用户 · 共 ${inbox.length} 条</span></div>
    <div class="inbox-list">${items}</div>`;
}

/* ===== 大图预览灯箱 ===== */
function openLightbox(c, s){
  $('lbImg').src = c.url || '';
  $('lbImg').style.background = c.url ? '' : gradCss(c.grad);
  $('lbImg').onerror = function(){ this.style.display='none'; };
  // 姓名
  $('lbNick').textContent = c.nickname ? c.nickname : '';
  // 资料信息
  const profItems = [];
  if(c.height) profItems.push(['身高', c.height]);
  if(c.age) profItems.push(['年龄', c.age]);
  if(c.job) profItems.push(['职业', c.job]);
  if(c.hobby) profItems.push(['爱好', c.hobby]);
  if(c.bwh) profItems.push(['三维', c.bwh]);
  const profEl = $('lbProfile');
  profEl.innerHTML = profItems.map(([k,v])=>`<div class="lp-item">${k}<b>${escapeHtml(v)}</b></div>`).join('');
  profEl.previousElementSibling.style.display = profItems.length ? '' : 'none';
  profEl.style.display = profItems.length ? '' : 'none';
  // 备注（仅客服可见，用于图片分类，普通用户不显示）
  const tagsEl = $('lbTags');
  const isStaffRole = s && s.role === 'staff';
  const showTags = isStaffRole && c.tags && c.tags.length;
  tagsEl.innerHTML = showTags ? c.tags.map(t=>`<span class="lb-tag">${escapeHtml(t)}</span>`).join('') : '';
  tagsEl.previousElementSibling.style.display = showTags ? '' : 'none';
  tagsEl.style.display = showTags ? '' : 'none';
  // 个人介绍
  const introEl = $('lbIntro');
  introEl.textContent = c.intro || '';
  introEl.previousElementSibling.style.display = c.intro ? '' : 'none';
  introEl.style.display = c.intro ? '' : 'none';
  // 爱心
  $('lbHeart').dataset.lid = c.id;
  updateLbHeart(c);
  $('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  $('lightbox').classList.remove('show');
  document.body.style.overflow = '';
}
function updateLbHeart(c){
  const liked = likedIds.has(c.id);
  $('lbHeart').className = 'lb-heart ' + (liked?'on':'');
  $('lbHeart').innerHTML = liked ? HEART_ON : HEART_OFF;
}

function bindMain(s){
  const role = s.role;
  // 每日推荐分页
  document.querySelectorAll('[data-dpage]').forEach(el=>el.onclick=()=>{
    const totalPages = Math.ceil(gallery.length / DAILY_PER_PAGE);
    if(el.dataset.dpage==='prev') dailyPage = Math.max(0, dailyPage-1);
    if(el.dataset.dpage==='next') dailyPage = Math.min(totalPages-1, dailyPage+1);
    renderApp(s);
    document.querySelector('.daily-grid')?.scrollIntoView({behavior:'smooth',block:'start'});
  });
  document.querySelectorAll('[data-like]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const c=gallery.find(x=>x.id==el.dataset.like); const id=+el.dataset.like;
    if(likedIds.has(id)){ likedIds.delete(id); toast(`已取消喜欢`); }
    else { likedIds.add(id); toast(`已加入喜欢：<b>${c.title}</b>`); }
    saveLiked(s); renderApp(s);
  });
  document.querySelectorAll('[data-unlike]').forEach(el=>el.onclick=()=>{
    const c=gallery.find(x=>x.id==el.dataset.unlike);
    likedIds.delete(+el.dataset.unlike); saveLiked(s); renderApp(s);
    toast(`已从收藏移除：<b>${c.title}</b>`);
  });
  // 客服删除图片（调后端）
  document.querySelectorAll('[data-del]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const c=gallery.find(x=>x.id==el.dataset.del);
    if(!c) return;
    if(confirm('确认删除「'+c.title+'」？删除后不可恢复。')){
      try{
        const r=await fetch(PARSER_BASE + '/api/gallery/'+c.id+'?password='+encodeURIComponent(s.password),{method:'DELETE'});
        const d=await r.json();
        if(d.success){ await loadGallery(); renderApp(s); toast(`已删除：<b>${c.title}</b>`); }
        else toast(d.error||'删除失败',true);
      }catch(e){ toast('删除失败，请检查服务',true); }
    }
  });
  // 点击每日推荐图片 → 弹出大图
  document.querySelectorAll('[data-preview]').forEach(el=>el.onclick=()=>{
    const c=gallery.find(x=>x.id==el.dataset.preview);
    if(!c) return;
    openLightbox(c, s);
  });
  // 灯箱关闭
  $('lbClose').onclick=()=> closeLightbox();
  $('lightbox').onclick=e=>{ if(e.target===$('lightbox')) closeLightbox(); };
  // 灯箱内爱心
  $('lbHeart').onclick=()=>{
    const id=+$('lbHeart').dataset.lid;
    const c=gallery.find(x=>x.id==id); if(!c) return;
    if(likedIds.has(id)){ likedIds.delete(id); toast('已取消喜欢'); }
    else { likedIds.add(id); toast(`已加入喜欢：<b>${c.title}</b>`); }
    saveLiked(s); updateLbHeart(c); renderApp(s);
  };
  const up=$('uploadBtn'); if(up) up.onclick=async()=>{
    const fav=gallery.filter(c=>likedIds.has(c.id)); if(!fav.length) return;
    const from = role==='staff' ? '客服（自测）' : '用户 · '+s.username;
    const items=fav.map(c=>({title:c.title,grad:c.grad,url:c.url,from,username:s.username}));
    try{
      const r=await fetch(PARSER_BASE + '/api/inbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});
      const d=await r.json();
      if(d.success){
        fav.forEach(c=>likedIds.delete(c.id)); saveLiked(s);
        toast(`已一键上传 <b>${items.length}</b> 张给客服`);
        tab = role==='staff' ? 'inbox' : 'fav';
        if(role==='staff') await loadInbox();
        renderApp(s);
      } else toast(d.error||'上传失败',true);
    }catch(e){ toast('上传失败，请检查服务',true); }
  };

  // 添加图片 - 模式切换
  document.querySelectorAll('[data-amode]').forEach(b=>b.onclick=()=>{ addMode=b.dataset.amode; renderApp(s); });

  // 图片备注多选标签
  document.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{
    const tag = el.dataset.tag;
    if(selectedTags.has(tag)) selectedTags.delete(tag);
    else selectedTags.add(tag);
    el.classList.toggle('sel');
  });

  // 回退配色选择
  document.querySelectorAll('.grad-opt').forEach(el=>el.onclick=()=>{ newGrad=+el.dataset.grad; renderApp(s); });

  // ===== 百度网盘解析模式 =====
  const parseBtn=$('parseBtn');
  if(parseBtn) parseBtn.onclick=()=> doParse(s);

  // 解析结果卡片点击选择
  document.querySelectorAll('[data-pidx]').forEach(el=>el.onclick=()=>{
    const idx=+el.dataset.pidx;
    if(selectedImgs.has(idx)) selectedImgs.delete(idx); else selectedImgs.add(idx);
    renderApp(s);
  });
  const selAll=$('selAllBtn'); if(selAll) selAll.onclick=()=>{
    parsedImages.forEach((_,i)=>selectedImgs.add(i)); renderApp(s);
  };
  const selNone=$('selNoneBtn'); if(selNone) selNone.onclick=()=>{
    selectedImgs.clear(); renderApp(s);
  };
  const addParsed=$('addParsedBtn'); if(addParsed) addParsed.onclick=async()=>{
    const toAdd = [...selectedImgs].map(i=>parsedImages[i]).filter(x=>x);
    if(!toAdd.length) return;
    // 读取资料信息和备注
    const nameEl=$('bdName');
    const nickname = nameEl ? nameEl.value.trim() : '';
    const heightEl=$('bdHeight');
    const height = heightEl ? heightEl.value.trim() : '';
    const ageEl=$('bdAge');
    const age = ageEl ? ageEl.value.trim() : '';
    const jobEl=$('bdJob');
    const job = jobEl ? jobEl.value.trim() : '';
    const hobbyEl=$('bdHobby');
    const hobby = hobbyEl ? hobbyEl.value.trim() : '';
    const bwhEl=$('bdBwh');
    const bwh = bwhEl ? bwhEl.value.trim() : '';
    const tags = [...selectedTags];
    const introEl=$('bdIntro');
    const intro = introEl ? introEl.value.trim() : '';
    // 逐张校验图片规格
    toast('正在检查图片规格...', false);
    let validImgs=[], invalidCount=0;
    for(const img of toAdd){
      const check = await checkImageDimensions(fullProxyUrl(img.url), img.resolution);
      if(check.valid){ validImgs.push({...img, ratio:check.ratio}); }
      else { invalidCount++; }
    }
    if(invalidCount>0 && !validImgs.length){
      toast('规格不正确，请上传正确规格的图（'+invalidCount+' 张不符合）', true);
      return;
    }
    let okCount=0;
    for(const img of validImgs){
      try{
        const r=await fetch(PARSER_BASE + '/api/gallery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          title: img.name.replace(/\.[^.]+$/,'') || ('美图 '+(gallery.length+1)),
          s:'百度网盘', grad:newGrad,
          url: fullProxyUrl(img.url), srcTag:'网盘', password:s.password, ratio:img.ratio,
          nickname: nickname, tags: tags, intro: intro,
          height: height, age: age, job: job, hobby: hobby, bwh: bwh
        })});
        const d=await r.json();
        if(d.success) okCount++;
      }catch(e){}
    }
    if(invalidCount>0){
      toast(`已添加 <b>${okCount}</b> 张到图库，${invalidCount} 张规格不符已跳过`);
    } else {
      toast(`已添加 <b>${okCount}</b> 张到图库`);
    }
    parsedImages=[]; selectedImgs.clear(); selectedTags.clear();
    await loadGallery(); dailyPage=0; tab='daily'; renderApp(s);
  };

  // ===== 图片直链模式 =====
  const urlInput=$('urlInput');
  if(urlInput){
    const updPreview=()=>{ const v=urlInput.value.trim(); const ph=$('previewPh');
      if(v){ $('preview').innerHTML=`<img src="${v}" onerror="this.style.display='none';document.getElementById('previewPh').style.display='flex'"><div class="ph" id="previewPh" style="display:none">加载失败</div>`; }
      else { $('preview').innerHTML=`<div class="ph">预览</div>`; $('preview').style.background=gradCss(newGrad); }
    };
    urlInput.oninput=updPreview;
    $('sampleBtn').onclick=()=>{ urlInput.value='https://picsum.photos/seed/mg'+uid()+'/360/640'; updPreview(); toast('已填入示例图片直链（9:16）'); };
  }
  // ImgBB 本地上传到图床
  const imgbbFile=$('imgbbFileInput');
  const imgbbBtn=$('imgbbUploadBtn');
  const imgbbStatus=$('imgbbStatus');
  let uploadedUrl = '';
  if(imgbbBtn && imgbbFile){
    imgbbBtn.onclick=async ()=>{
      const file = imgbbFile.files[0];
      if(!file){ toast('请先选择一张图片', true); return; }
      if(file.size > 32*1024*1024){ toast('图片超过32MB限制', true); return; }
      imgbbBtn.disabled=true;
      imgbbBtn.textContent='上传中...';
      imgbbStatus.textContent='⏳ 正在上传到 ImgBB 图床...';
      try{
        uploadedUrl = await uploadToImgBB(file);
        imgbbStatus.innerHTML='✅ 上传成功！直链：<code style="font-size:10px;word-break:break-all;">'+uploadedUrl+'</code>';
        imgbbStatus.style.color='#4ade80';
        toast('上传成功，图片已存储到云端图床');
      }catch(e){
        uploadedUrl = '';
        imgbbStatus.textContent='❌ 上传失败：'+e;
        imgbbStatus.style.color='#ff6b9d';
        toast('上传失败：'+e, true);
      }finally{
        imgbbBtn.disabled=false;
        imgbbBtn.textContent='上传到图床';
      }
    };
  }
  // 通过链接添加到图库（URL直链）
  const addBtn=$('addBtn'); if(addBtn) addBtn.onclick=async()=>{
    const url=($('urlInput').value||'').trim();
    if(!url){ toast('请粘贴图片链接', true); return; }
    const title='美图 '+(gallery.length+1);
    toast('正在检查图片规格...', false);
    const check = await checkImageDimensions(url);
    if(!check.valid){ toast('规格不正确，请上传正确规格的图', true); return; }
    try{
      const r=await fetch(PARSER_BASE + '/api/gallery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,s:'直链',grad:newGrad,url,srcTag:'直链',password:s.password,ratio:check.ratio,intro:''})});
      const d=await r.json();
      if(d.success){ toast(`已通过链接添加到图库：<b>${title}</b>（${check.ratio.replace('/',':')}）`); await loadGallery(); dailyPage=0; tab='daily'; renderApp(s); }
      else toast(d.error||'添加失败',true);
    }catch(e){ toast('添加失败，请检查服务',true); }
  };
  // 上传本地图片到图库（含资料信息、备注等）
  const localAddBtn=$('localAddBtn');
  if(localAddBtn) localAddBtn.onclick=async()=>{
    if(!uploadedUrl){ toast('请先上传图片到图床', true); return; }
    const nickname=($('localName').value||'').trim();
    const height=($('localHeight').value||'').trim();
    const age=($('localAge').value||'').trim();
    const job=($('localJob').value||'').trim();
    const hobby=($('localHobby').value||'').trim();
    const bwh=($('localBwh').value||'').trim();
    const tags=[...selectedTags];
    const intro=($('localIntro').value||'').trim();
    const title=nickname||('美图 '+(gallery.length+1));
    toast('正在检查图片规格...', false);
    const check = await checkImageDimensions(uploadedUrl);
    if(!check.valid){ toast('规格不正确，请上传正确规格的图', true); return; }
    try{
      const r=await fetch(PARSER_BASE + '/api/gallery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,s:'上传',grad:newGrad,url:uploadedUrl,srcTag:'上传',password:s.password,ratio:check.ratio,intro,nickname,height,age,job,hobby,bwh,tags})});
      const d=await r.json();
      if(d.success){
        toast(`已添加 <b>${title}</b> 到图库`);
        selectedTags.clear();
        await loadGallery(); dailyPage=0; tab='daily'; renderApp(s);
      } else toast(d.error||'添加失败',true);
    }catch(e){ toast('添加失败，请检查服务',true); }
  };

  // 收件箱 / 消息 - 点击进入聊天
  document.querySelectorAll('[data-chat]').forEach(el=>el.onclick=()=>{
    openChat(el.dataset.chat, s);
  });
  // 收件箱 - 删除按钮
  document.querySelectorAll('[data-inbox-del]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const username=el.dataset.inboxDel;
    if(!confirm('确认删除「'+username+'」的所有上传记录？此操作不可恢复。')) return;
    try{
      const r=await fetch(PARSER_BASE + '/api/inbox',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password:s.password})});
      const d=await r.json();
      if(d.success){ await loadInbox(); renderApp(s); toast('已删除「'+username+'」的所有记录'); }
      else toast(d.error||'删除失败',true);
    }catch(e){ toast('删除失败，请检查服务',true); }
  });
  // 聊天模态框事件绑定（每次渲染都重新绑定）
  bindChatEvents(s);
}

/* ===== 百度网盘分享链接解析 ===== */
async function doParse(s){
  const urlEl=$('bdUrl'), codeEl=$('bdCode');
  if(!urlEl) return;
  const url=urlEl.value.trim();
  const code=codeEl ? codeEl.value.trim() : '';

  if(!url){ toast('请输入百度网盘分享链接', true); return; }
  if('pan.baidu.com'!==url.split('/')[2] && !url.includes('pan.baidu.com')){
    toast('请输入有效的百度网盘分享链接', true); return;
  }

  parseLoading=true;
  parsedImages=[];
  selectedImgs.clear();
  renderApp(s);

  try{
    const resp = await fetch(PARSER_BASE + '/api/parse', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url, code})
    });
    const data = await resp.json();
    parseLoading=false;

    if(data.success && data.images && data.images.length>0){
      parsedImages = data.images;
      // 默认全选
      data.images.forEach((_,i)=>selectedImgs.add(i));
      toast(`解析成功，找到 <b>${data.images.length}</b> 张图片`);
    } else {
      toast(data.error || '解析失败，请检查链接和提取码', true);
    }
  } catch(e){
    parseLoading=false;
    toast('解析服务连接失败，请确认服务正在运行', true);
  }
  renderApp(s);
}

/* ============ 聊天功能 ============ */
function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

function extractUsername(item){
  if(item.username) return item.username;
  const from=item.from||'';
  const parts=from.split('\u00b7');
  return parts.length>1 ? parts[parts.length-1].trim() : from;
}

async function openChat(username, session){
  chatUser=username;
  chatShowLikes=false;
  chatMessages=[];
  lastKnownMsgId=0; // 重置消息追踪
  const isStaff = session && session.role==='staff';
  $('chatName').textContent = isStaff ? username : '客服';
  $('chatSub').textContent = isStaff ? '点击下方开关查看用户喜欢的图' : '与客服的对话';
  $('chatAvatar').textContent = (isStaff ? username : '客').slice(0,1).toUpperCase();
  $('chatToggle').classList.remove('on');
  $('chatLikes').classList.add('hidden');
  $('chatInput').value='';
  $('chatOverlay').classList.add('show');
  $('chatInput').placeholder = isStaff ? '给 '+username+' 发消息...' : '给客服发消息...';
  await loadChatMessages(username);
  startChatPoll();
}

function closeChat(){
  $('chatOverlay').classList.remove('show');
  chatUser=null;
  lastKnownMsgId=0;
  stopChatPoll();
}

let lastKnownMsgId = 0; // 上次轮询时已知的最新消息 ID

async function loadChatMessages(username){
  try{
    const r=await fetch(PARSER_BASE + '/api/chat/'+encodeURIComponent(username));
    const d=await r.json();
    if(d.success){
      const msgs = d.messages||[];
      const prevLen = chatMessages.length;
      const newMsgs = prevLen > 0 ? msgs.filter(m => !chatMessages.find(cm => cm.time === m.time && cm.text === m.text)) : [];
      const isOwnNewMsg = msgs.length > prevLen;
      chatMessages=msgs;
      renderChatMessages(isOwnNewMsg);
      // 对方发来新消息（不是自己刚发的）→ 播放提示音
      if(newMsgs.length > 0 && !isOwnNewMsg){
        playBeep('chat');
      }
      // 记录最新消息 ID
      if(msgs.length > 0) lastKnownMsgId = msgs[msgs.length-1].id || msgs[msgs.length-1].time || 0;
    }
  }catch(e){ console.error('聊天加载失败',e); }
}

function renderChatMessages(isOwnNewMsg){
  const body=$('chatBody');
  if(!chatMessages.length){
    body.innerHTML='<div class="chat-empty">还没有消息，发一条试试吧</div>';
    return;
  }
  body.innerHTML=chatMessages.map((m,i)=>{
    const isStaff=m.sender==='staff';
    const time=new Date(m.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    const isNew = isOwnNewMsg && i === chatMessages.length - 1;
    return `<div class="msg ${isStaff?'staff':'user'}${isNew?' new-msg':''}">${escapeHtml(m.text)}<div class="time">${time}</div></div>`;
  }).join('');
  body.scrollTop=body.scrollHeight;
}

async function sendChatMessage(session){
  const input=$('chatInput');
  const text=input.value.trim();
  if(!text||!chatUser) return;
  input.value='';
  const sender = session && session.role==='staff' ? 'staff' : 'user';
  try{
    const r=await fetch(PARSER_BASE + '/api/chat/'+encodeURIComponent(chatUser),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sender, text})
    });
    const d=await r.json();
    if(d.success){ chatMessages.push(d.message); renderChatMessages(true); }
    else toast(d.error||'发送失败',true);
  }catch(e){ toast('发送失败，请检查服务',true); }
}

async function loadUserLikes(username){
  try{
    const r=await fetch(PARSER_BASE + '/api/user-likes/'+encodeURIComponent(username));
    const d=await r.json();
    if(d.success){
      const likes=d.likes||[];
      const container=$('chatLikes');
      if(!likes.length){
        container.innerHTML='<div style="color:var(--muted);font-size:12px;padding:10px;">该用户还没有上传喜欢的图</div>';
      } else {
        container.innerHTML=likes.map(it=>`
          <div class="chat-like-item">
            <div class="thumb" style="background:${gradCss(it.grad)}">
              ${it.url?`<img src="${fullProxyUrl(it.url)}" onerror="this.style.display='none'">`:''}
            </div>
            <div class="lbl">${escapeHtml(it.title||'美图')}</div>
          </div>`).join('');
      }
    }
  }catch(e){ console.error('加载用户喜欢的图失败',e); }
}

function toggleChatLikes(){
  chatShowLikes=!chatShowLikes;
  $('chatToggle').classList.toggle('on',chatShowLikes);
  const likesEl=$('chatLikes');
  if(chatShowLikes){
    likesEl.classList.remove('hidden');
    if(chatUser) loadUserLikes(chatUser);
  } else {
    likesEl.classList.add('hidden');
  }
}

function startChatPoll(){
  stopChatPoll();
  chatPollTimer=setInterval(()=>{ if(chatUser) loadChatMessages(chatUser); },3000);
}

function stopChatPoll(){
  if(chatPollTimer){ clearInterval(chatPollTimer); chatPollTimer=null; }
}

function bindChatEvents(session){
  $('chatClose').onclick=closeChat;
  $('chatToggle').onclick=toggleChatLikes;
  $('chatSend').onclick=()=>sendChatMessage(session);
  $('chatInput').onkeydown=e=>{ if(e.key==='Enter') sendChatMessage(session); };
  $('chatOverlay').onclick=e=>{ if(e.target===$('chatOverlay')) closeChat(); };
}

/* localtunnel 访问优化：获取公网 IP 并显示提示 */
async function checkTunnelIP(){
  if(!window.location.hostname.endsWith('.loca.lt')) return;
  try{
    const r = await fetch(PARSER_BASE + '/api/public-ip');
    const d = await r.json();
    if(d.ip){
      window.__PUBLIC_IP__ = d.ip;
      const tip = document.createElement('div');
      tip.id = 'tunnelTip';
      tip.style.cssText = 'position:fixed;top:8px;right:8px;z-index:99999;background:var(--surface);color:var(--accent);padding:10px 16px;border-radius:4px;font-size:13px;border:1px solid var(--border);max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,0.4);line-height:1.6;letter-spacing:.3px;';
      tip.innerHTML = '<div>公网 IP：<b style="font-size:15px;letter-spacing:1px">'+d.ip+'</b></div><div style="color:#888;font-size:11px;margin-top:4px">首次访问确认页面时输入此 IP，之后不会再弹</div>';
      document.body.prepend(tip);
      setTimeout(()=>{ if(tip){ tip.style.transition='opacity 0.5s'; tip.style.opacity='0'; setTimeout(()=>tip.remove(),500); } }, 12000);
    }
  }catch(e){ /* ignore */ }
}

/* ESC 关闭灯箱 */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if($('lightbox').classList.contains('show')) closeLightbox();
  }
});

/* 启动 */
route();
checkTunnelIP();
</script>
